<fieldset class="checkout-info">

    <form>

        <div class="input-group">
            <label for="phone">Phone number: </label>
            <input type="tel" id="phone" name="phone" pattern="^01[0125][0-9]{8}$" placeholder="01xxxxxxxxx" required>
        </div>

        <div class="input-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address here..." required></textarea>
        </div>

        <div class="payment-method">
            <label for="payment">Payment method:</label>

            <div class="radio">
                <div class="radio-input-group">
                    <input type="radio" id="cash" name="payment" value="cash" required>
                    <label for="cash">Cash on delivery</label>
                </div>

                <div class="radio-input-group">
                    <input type="radio" id="card" name="payment" value="card" required>
                    <label for="card">Card</label>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="2" placeholder="Enter any notes here..."></textarea>
        </div>

    </form>
</fieldset>

<fieldset class="summary">
    <p>Total: {{total}} EGP</p>
    <button routerLink="/cart/checkout" class="checkout-btn" >Checkout</button>
</fieldset>
