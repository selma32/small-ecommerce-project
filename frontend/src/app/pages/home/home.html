  <header class="hero-section">
    <div class="hero-container">
      <h4 class="hero-title">Shop All</h4>
      <p class="hero-subtitle">Get All Your Daily Needs.</p>
      
      <app-search></app-search>

    </div>
  </header>

  <app-news-section></app-news-section>

  <div class="trending-section">
    <h2>Trending Now</h2>
    <div class="card-container trending-container">

      @for (product of trendingProducts(); track product._id) {
        <app-product-card [product]="product" />
      } @empty {
        <p>No trending products yet.</p>
      }

    </div>
  </div>
